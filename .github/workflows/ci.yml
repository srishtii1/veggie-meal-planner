name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups --frozen
      - run: uv run pytest -q -m "not integration" --cov --cov-report=xml --cov-report=term
        env:
          GOOGLE_API_KEY: not-a-real-key
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: veggie-meal-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --rm --name vmp -p 8080:8080 \
            -e GOOGLE_API_KEY=not-a-real-key -e GOOGLE_GENAI_USE_VERTEXAI=FALSE \
            -e VMP_SESSION_BACKEND=memory veggie-meal-planner:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | grep '"status":"ok"'
          curl -fsS http://localhost:8080/a2a/.well-known/agent-card.json | grep meal_planner_coordinator
          docker stop vmp
